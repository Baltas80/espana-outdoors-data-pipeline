[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espana-outdoors-data-pipeline"
version = "0.1.0"
description = "Safe inventory and processing pipeline for geographic data used by España Outdoor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Baltas80" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
espana-outdoors-scan = "espana_outdoors_pipeline.scanner:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
